<style id="kz-calendar-enhancement-styles">
  [data-kz-calendar-enhanced] {
    --kz-green:#1B4632;
    --kz-green-dark:#102C1E;
    --kz-gold:#B8912F;
    --kz-rust:#8C4A20;
    --kz-cream:#F7F1E4;
    --kz-paper:#F5EFE2;
    --kz-muted:#6C7B6E;
    --kz-ink:#17251B;
    --kz-line:rgba(20,45,32,.12);
    font-family:Archivo,system-ui,sans-serif;
    color:var(--kz-ink);
    box-sizing:border-box;
  }
  [data-kz-calendar-enhanced] *, [data-kz-wellbeing-date] * { box-sizing:border-box; }
  .kz-cal-mount { min-width:0; min-height:0; }
  .kz-cal-mount.kz-cal-desktop {
    position:absolute; z-index:8; left:18px; right:18px; top:50px; bottom:16px;
    display:flex; flex-direction:column;
  }
  .kz-cal-mount.kz-cal-mobile {
    position:relative; z-index:8; margin-top:12px; min-height:320px;
    display:flex; flex-direction:column;
  }
  .kz-cal-toolbar { display:flex; align-items:center; gap:7px; min-height:32px; flex:0 0 auto; }
  .kz-cal-segment,.kz-cal-nav {
    display:inline-flex; align-items:center; border:1px solid rgba(20,45,32,.13);
    background:rgba(255,255,255,.34); border-radius:6px; overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
  }
  .kz-cal-control {
    appearance:none; border:0; margin:0; min-height:31px; padding:0 10px; background:transparent;
    color:#4C5A4E; font:500 10px/1 Archivo,system-ui,sans-serif; cursor:pointer;
    transition:background 160ms ease,color 160ms ease,transform 120ms ease; white-space:nowrap;
  }
  .kz-cal-control + .kz-cal-control { border-left:1px solid rgba(20,45,32,.10); }
  .kz-cal-control:hover { background:rgba(27,70,50,.07); color:var(--kz-green); }
  .kz-cal-control:active { transform:scale(.96); }
  .kz-cal-control.is-active {
    background:linear-gradient(180deg,#22553A,#173C28); color:#F4EDDC;
    box-shadow:inset 0 0 0 1px rgba(184,145,47,.28);
  }
  .kz-cal-nav .kz-cal-control.is-today { color:var(--kz-green); font-weight:600; }
  .kz-cal-filter-wrap { position:relative; margin-left:auto; }
  .kz-cal-filter {
    appearance:none; border:1px solid rgba(20,45,32,.13); border-radius:6px; min-height:32px; padding:0 9px;
    background:rgba(255,255,255,.34); color:#39473B; font:500 10px/1 Archivo,system-ui,sans-serif;
    display:inline-flex; align-items:center; gap:7px; cursor:pointer; white-space:nowrap;
    transition:background 160ms ease,border-color 160ms ease,transform 120ms ease;
  }
  .kz-cal-filter:hover { background:rgba(27,70,50,.07); border-color:rgba(27,70,50,.24); }
  .kz-cal-filter:active { transform:scale(.97); }
  .kz-cal-filter.is-open { border-color:rgba(184,145,47,.55); background:rgba(184,145,47,.08); }
  .kz-cal-filter-icon { width:13px;height:13px;display:inline-grid;grid-template-columns:repeat(2,4px);gap:2px;align-content:center;justify-content:center; }
  .kz-cal-filter-icon i { width:4px;height:4px;border-radius:50%;display:block;background:var(--kz-green); }
  .kz-cal-filter-icon i:nth-child(2){background:var(--kz-gold);} .kz-cal-filter-icon i:nth-child(3){background:#6F88C7;}
  .kz-cal-filter-count { font-family:'IBM Plex Mono',monospace; font-size:8.5px; color:#7A8A7C; padding-left:2px; }
  .kz-cal-popover {
    position:absolute; z-index:90; top:39px; right:0; width:268px; max-width:min(82vw,268px); padding:11px;
    border-radius:8px; background:linear-gradient(180deg,#F7F1E4,#F0E8D8);
    border:1px solid rgba(184,145,47,.38); box-shadow:0 22px 48px -24px rgba(10,31,21,.65);
  }
  .kz-cal-popover-head { display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px; }
  .kz-cal-popover-title { font-family:'Bodoni Moda',serif;font-size:14px;color:#132A1D;line-height:1.15; }
  .kz-cal-popover-meta { font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:#7A8A7C;white-space:nowrap; }
  .kz-cal-quick { display:flex;gap:5px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(20,45,32,.09); }
  .kz-cal-quick button {
    appearance:none;border:1px solid rgba(20,45,32,.12);border-radius:4px;background:rgba(255,255,255,.38);
    color:#4C5A4E;font:500 9px/1 Archivo,system-ui,sans-serif;min-height:28px;padding:0 9px;cursor:pointer;
  }
  .kz-cal-quick button:hover { background:rgba(27,70,50,.07);color:var(--kz-green); }
  .kz-cal-list { display:flex;flex-direction:column;gap:3px;max-height:210px;overflow:auto;padding-right:2px; }
  .kz-cal-row {
    appearance:none;border:0;border-radius:5px;background:transparent;width:100%;min-height:34px;padding:5px 7px;
    display:grid;grid-template-columns:16px 10px minmax(0,1fr);gap:7px;align-items:center;text-align:left;cursor:pointer;color:#39473B;
    transition:background 140ms ease;
  }
  .kz-cal-row:hover { background:rgba(27,70,50,.07); }
  .kz-cal-check { width:15px;height:15px;border-radius:3px;border:1px solid rgba(27,70,50,.28);display:grid;place-items:center;color:transparent;font-size:10px;background:rgba(255,255,255,.35); }
  .kz-cal-row.is-selected .kz-cal-check { background:var(--kz-green);border-color:var(--kz-green);color:#F4EDDC; }
  .kz-cal-dot { width:8px;height:8px;border-radius:50%;display:block; }
  .kz-cal-name { min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px; }
  .kz-cal-body { position:relative;flex:1 1 auto;min-height:0;margin-top:9px;display:flex;flex-direction:column;overflow:hidden; }
  .kz-cal-loading,.kz-cal-empty {
    flex:1;min-height:0;display:grid;place-items:center;text-align:center;color:#7A8A7C;font-size:10.5px;
    border:1px dashed rgba(20,45,32,.11);border-radius:5px;background:rgba(255,255,255,.22);
  }
  .kz-cal-spinner { width:18px;height:18px;border-radius:50%;border:2px solid rgba(27,70,50,.14);border-top-color:var(--kz-green);animation:kSpin .8s linear infinite;margin:0 auto 7px; }
  .kz-agenda { flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden; }
  .kz-agenda-head { flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:7px; }
  .kz-agenda-date { font-family:'Bodoni Moda',serif;font-size:14px;color:var(--kz-green);line-height:1.15; }
  .kz-agenda-count { font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:#7A8A7C;white-space:nowrap; }
  .kz-agenda-list { flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:5px;padding-right:2px;scrollbar-width:thin;scrollbar-color:rgba(27,70,50,.24) transparent; }
  .kz-event { flex:0 0 auto;display:grid;grid-template-columns:48px 3px minmax(0,1fr);gap:8px;align-items:center;min-height:45px;padding:7px 8px;border-radius:5px;background:rgba(255,255,255,.31);border:1px solid rgba(20,45,32,.08); }
  .kz-event-time { font-family:'IBM Plex Mono',monospace;font-size:9px;color:#667668;text-align:right;white-space:nowrap; }
  .kz-event-rail { width:3px;height:28px;border-radius:2px;display:block; }
  .kz-event-main { min-width:0; }
  .kz-event-title { font-size:11px;font-weight:500;color:#213326;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2; }
  .kz-event-meta { margin-top:3px;display:flex;align-items:center;gap:6px;min-width:0;color:#7A8A7C;font-size:8.7px; }
  .kz-event-meta span { min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .kz-week-strip { display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;flex:0 0 auto;margin-bottom:8px; }
  .kz-week-day { appearance:none;position:relative;border:1px solid rgba(20,45,32,.09);border-radius:5px;background:rgba(255,255,255,.28);min-width:0;height:52px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;color:#4C5A4E;transition:background 150ms ease,border-color 150ms ease,transform 120ms ease; }
  .kz-week-day:hover { background:rgba(27,70,50,.07); }
  .kz-week-day:active { transform:scale(.96); }
  .kz-week-day.is-selected { background:rgba(27,70,50,.12);border-color:rgba(27,70,50,.30); }
  .kz-week-day.is-today { box-shadow:inset 0 0 0 1px rgba(184,145,47,.48); }
  .kz-week-wd { font-family:'IBM Plex Mono',monospace;font-size:7.5px;letter-spacing:.05em;color:#7A8A7C; }
  .kz-week-num { font-family:'Bodoni Moda',serif;font-size:15px;line-height:1;color:#39473B; }
  .kz-week-day.is-selected .kz-week-num { color:var(--kz-green); }
  .kz-week-events { display:flex;align-items:center;justify-content:center;gap:2px;height:5px;margin-top:2px; }
  .kz-week-events i { width:4px;height:4px;border-radius:50%;display:block; }
  .kz-week-more { font-family:'IBM Plex Mono',monospace;font-size:6.5px;color:#7A8A7C;line-height:1; }
  .kz-month { flex:1;min-height:0;display:grid;grid-template-rows:15px minmax(0,1fr);gap:4px; }
  .kz-month-weekdays { display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px; }
  .kz-month-weekdays span { text-align:center;font-family:'IBM Plex Mono',monospace;font-size:7px;color:#889589;letter-spacing:.04em; }
  .kz-month-grid { min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:3px; }
  .kz-month-day { appearance:none;border:1px solid rgba(20,45,32,.07);border-radius:4px;background:rgba(255,255,255,.27);min-width:0;min-height:0;padding:3px 3px 2px;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;transition:background 140ms ease,border-color 140ms ease,transform 120ms ease; }
  .kz-month-day:hover { background:rgba(27,70,50,.07);border-color:rgba(27,70,50,.17); }
  .kz-month-day:active { transform:scale(.96); }
  .kz-month-day.is-outside { opacity:.34; }
  .kz-month-day.is-today { box-shadow:inset 0 0 0 1px rgba(184,145,47,.58);background:rgba(184,145,47,.06); }
  .kz-month-day.is-selected { border-color:rgba(27,70,50,.34);background:rgba(27,70,50,.10); }
  .kz-month-num { font-family:'Bodoni Moda',serif;font-size:11.5px;color:#455449;line-height:1; }
  .kz-month-day.is-today .kz-month-num,.kz-month-day.is-selected .kz-month-num { color:var(--kz-green);font-weight:600; }
  .kz-month-events { width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:2px;min-height:8px; }
  .kz-month-dots { display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden; }
  .kz-month-dots i { width:4px;height:4px;border-radius:50%;display:block;flex:0 0 auto; }
  .kz-month-count { font-family:'IBM Plex Mono',monospace;font-size:6.5px;color:#7A8A7C;line-height:1;white-space:nowrap; }
  .kz-cal-error { margin-top:6px;color:var(--kz-rust);font-size:9.5px;line-height:1.3; }
  [data-kz-wellbeing-date] { font-family:Archivo,system-ui,sans-serif; }
  .kz-wb-date { margin-top:12px;padding:9px 11px;border-radius:8px;background:rgba(255,255,255,.28);border:1px solid rgba(20,45,32,.11);display:flex;align-items:center;gap:9px;flex-wrap:wrap; }
  .kz-wb-date-label { font-size:11px;color:#4C5A4E;white-space:nowrap; }
  .kz-wb-input { appearance:none;min-height:39px;padding:0 10px;border-radius:6px;border:1px solid rgba(20,45,32,.17);background:#F7F1E4;color:#173C28;font-family:'IBM Plex Mono',monospace;font-size:13px; }
  .kz-wb-today { appearance:none;min-height:34px;padding:0 9px;border-radius:5px;border:1px solid rgba(20,45,32,.12);background:rgba(255,255,255,.36);color:#4C5A4E;font:500 10px/1 Archivo,system-ui,sans-serif;cursor:pointer; }
  .kz-wb-status { margin-left:auto;font-size:10px;color:#7A8A7C; }
  .kz-wb-status.is-saved { color:var(--kz-green);font-weight:500; }
  @media (max-width:720px) {
    .kz-cal-toolbar { flex-wrap:wrap;gap:8px; }
    .kz-cal-segment { flex:1; }
    .kz-cal-segment .kz-cal-control { flex:1;min-height:44px;font-size:13px;padding:0 10px; }
    .kz-cal-nav .kz-cal-control { min-height:44px;font-size:12px;padding:0 12px; }
    .kz-cal-filter { min-height:44px;font-size:12px;padding:0 12px; }
    .kz-cal-filter-count { font-size:10px; }
    .kz-cal-filter-wrap { margin-left:0; }
    .kz-cal-popover { top:51px;right:0;width:min(310px,calc(100vw - 52px));padding:12px; }
    .kz-cal-popover-title { font-size:17px; }
    .kz-cal-popover-meta,.kz-cal-name { font-size:12px; }
    .kz-cal-row { min-height:44px;grid-template-columns:18px 10px minmax(0,1fr); }
    .kz-cal-check { width:17px;height:17px; }
    .kz-cal-body { margin-top:12px;min-height:250px; }
    .kz-week-strip { gap:4px; }
    .kz-week-day { height:62px;border-radius:7px; }
    .kz-week-wd { font-size:9px; }
    .kz-week-num { font-size:18px; }
    .kz-week-events i { width:5px;height:5px; }
    .kz-agenda-date { font-size:18px; }
    .kz-agenda-count { font-size:10px; }
    .kz-event { grid-template-columns:58px 4px minmax(0,1fr);min-height:54px;padding:8px 9px;border-radius:7px; }
    .kz-event-time { font-size:11px; }
    .kz-event-title { font-size:14px; }
    .kz-event-meta { font-size:11px; }
    .kz-month { min-height:290px;grid-template-rows:18px minmax(0,1fr); }
    .kz-month-weekdays span { font-size:9px; }
    .kz-month-day { border-radius:6px;padding:5px 4px 4px; }
    .kz-month-num { font-size:15px; }
    .kz-month-dots i { width:5px;height:5px; }
    .kz-month-count { font-size:8px; }
    .kz-wb-date { padding:10px;border-radius:10px;gap:8px; }
    .kz-wb-date-label { font-size:13px; }
    .kz-wb-input { min-height:44px;font-size:15px;max-width:180px; }
    .kz-wb-today { min-height:44px;font-size:12px; }
    .kz-wb-status { width:100%;margin-left:0;font-size:12px; }
  }
</style>

<script>
(function () {
  'use strict';
  const PREF_KEY = 'kz.calendar.v2';
  const LEGACY_PREF_KEY = 'kz.calendar.v1';
  const GREEN = '#1B4632';
  const MUTED = '#6C7B6E';
  const WEEKDAYS = ['SO','MO','DI','MI','DO','FR','SA'];
  const state = { view:'week',anchorDate:todayKey(),calendarIds:null,calendars:[],events:[],periodLabel:'',menuOpen:false,loading:false,error:'',wellbeingDate:todayKey(),wellbeingSavedDate:'' };
  let observer = null;
  let refreshTimer = null;

  function todayKey(){ return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Berlin'}).format(new Date()); }
  function parseKey(value){ const v=String(value||''); if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return null; const d=new Date(v+'T12:00:00'); return Number.isFinite(d.getTime())?d:null; }
  function dateKey(date){ const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0'); return `${y}-${m}-${d}`; }
  function berlinKey(date){ return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Berlin'}).format(date); }
  function loadPrefs(){ try{ const p=JSON.parse(localStorage.getItem(PREF_KEY)||localStorage.getItem(LEGACY_PREF_KEY)||'null'); if(p&&['day','week','month'].includes(p.view))state.view=p.view; if(p&&Array.isArray(p.calendarIds))state.calendarIds=p.calendarIds.map(String); }catch(_){} }
  function savePrefs(){ try{ localStorage.setItem(PREF_KEY,JSON.stringify({view:state.view,calendarIds:state.calendarIds})); }catch(_){} }
  function call(name,...args){ return new Promise((resolve,reject)=>{ if(!window.google||!google.script||!google.script.run){reject(new Error('Apps-Script-Verbindung nicht verfügbar.'));return;} google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error&&error.message?error.message:String(error))))[name](...args); }); }

  async function loadCalendar(force){
    if(state.loading)return; state.loading=true; state.error=''; renderAll();
    try{
      const result=await call('getCalendarViewV4',{view:state.view,anchorDate:state.anchorDate,calendarIds:state.calendarIds},!!force);
      state.view=result&&result.view||state.view; state.anchorDate=result&&result.anchorDate||state.anchorDate;
      state.calendars=Array.isArray(result&&result.calendars)?result.calendars:[]; state.events=Array.isArray(result&&result.events)?result.events:[];
      state.periodLabel=result&&result.periodLabel||''; if(Array.isArray(result&&result.selectedCalendarIds))state.calendarIds=result.selectedCalendarIds.map(String); savePrefs();
    }catch(error){ state.error=error&&error.message?error.message:String(error); }
    finally{ state.loading=false; renderAll(); }
  }
  function navigate(direction){ const d=parseKey(state.anchorDate)||new Date(); if(state.view==='month')d.setMonth(d.getMonth()+direction); else d.setDate(d.getDate()+direction*(state.view==='week'?7:1)); state.anchorDate=dateKey(d); state.menuOpen=false; loadCalendar(false); }
  function setView(view){ if(!['day','week','month'].includes(view)||view===state.view)return; state.view=view; state.menuOpen=false; savePrefs(); loadCalendar(false); }
  function goToday(){ state.anchorDate=todayKey(); state.menuOpen=false; loadCalendar(false); }
  function openDay(date){ state.anchorDate=dateKey(date); state.view='day'; state.menuOpen=false; savePrefs(); loadCalendar(false); }
  function selectWeekDay(date){ state.anchorDate=dateKey(date); state.menuOpen=false; renderAll(); }
  function toggleCalendar(id){ const selected=new Set(Array.isArray(state.calendarIds)?state.calendarIds:[]); if(selected.has(id))selected.delete(id);else selected.add(id); state.calendarIds=Array.from(selected); savePrefs(); loadCalendar(false); }
  function selectStandardCalendars(){ state.calendarIds=state.calendars.filter(cal=>cal.defaultVisible!==false).map(cal=>String(cal.id)); savePrefs(); loadCalendar(false); }
  function selectAllCalendars(){ state.calendarIds=state.calendars.map(cal=>String(cal.id)); savePrefs(); loadCalendar(false); }
  function selectedCalendarCount(){ return Array.isArray(state.calendarIds)?state.calendarIds.length:0; }
  function calendarDisplayName(value){ const raw=String(value&&value.name!=null?value.name:value||'').trim(); if(!raw)return'Kalender'; if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(raw))return'Hauptkalender'; return raw; }
  function eventCalendarName(event){ return calendarDisplayName(event&&event.calendar||''); }
  function eventColor(event){ return String(event&&event.color||GREEN); }
  function eventsFor(date){ const target=berlinKey(date); return state.events.filter(event=>{const d=new Date(event.start);return Number.isFinite(d.getTime())&&berlinKey(d)===target;}); }
  function rangeStart(){ const d=parseKey(state.anchorDate)||new Date();d.setHours(12,0,0,0);if(state.view==='day')return d;if(state.view==='month')d.setDate(1);const weekday=d.getDay()||7;d.setDate(d.getDate()-weekday+1);return d; }
  function periodText(){ const anchor=parseKey(state.anchorDate)||new Date(); if(state.view==='day')return new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'2-digit',month:'short'}).format(anchor); if(state.view==='month')return new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(anchor); const start=rangeStart(),end=new Date(start);end.setDate(start.getDate()+6); if(start.getMonth()===end.getMonth())return `${String(start.getDate()).padStart(2,'0')}.–${String(end.getDate()).padStart(2,'0')}. ${new Intl.DateTimeFormat('de-DE',{month:'short'}).format(end)}`; return `${new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'short'}).format(start)}–${new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'short'}).format(end)}`; }
  function eventCountLabel(count){ return `${count} ${count===1?'TERMIN':'TERMINE'}`; }
  function node(tag,className,text){ const el=document.createElement(tag);if(className)el.className=className;if(text!=null)el.textContent=text;return el; }
  function stop(event){ event.preventDefault();event.stopPropagation(); }
  function control(label,active,action,extraClass){ const b=node('button',`kz-cal-control${active?' is-active':''}${extraClass?' '+extraClass:''}`,label);b.type='button';b.addEventListener('click',event=>{stop(event);action();});return b; }

  function findHosts(){
    const hosts=[];const desktop=document.querySelector('[data-tile="calendar"]');if(desktop)hosts.push({host:desktop,mobile:false,heading:null});
    const mobileRoot=document.querySelector('[data-screen-label="Kommandozentrale Mobil"]');
    if(mobileRoot){ const heading=Array.from(mobileRoot.querySelectorAll('div')).find(el=>/^(Kalender|Kalenderwoche|Kalendertag|Kalendermonat)$/.test((el.textContent||'').trim())); if(heading){ let card=heading.parentElement;while(card&&card!==mobileRoot){const style=card.getAttribute&&card.getAttribute('style')||'';if(/border-radius/.test(style)&&/background/.test(style))break;card=card.parentElement;}if(card&&card!==mobileRoot)hosts.push({host:card,mobile:true,heading}); } }
    return hosts;
  }
  function prepareHost(info){
    const{host,mobile,heading}=info;host.style.overflow='visible';let mount=host.querySelector(':scope > [data-kz-calendar-enhanced]');
    if(!mount){mount=node('div',`kz-cal-mount ${mobile?'kz-cal-mobile':'kz-cal-desktop'}`);mount.dataset.kzCalendarEnhanced='1';mount.addEventListener('click',event=>event.stopPropagation());host.appendChild(mount);}else mount.className=`kz-cal-mount ${mobile?'kz-cal-mobile':'kz-cal-desktop'}`;
    const title=mobile&&heading?heading:host.querySelector(':scope > div:first-child > div:first-child');
    const meta=mobile?(heading&&heading.parentElement?heading.parentElement.querySelector(':scope > div:last-child'):null):host.querySelector(':scope > div:first-child > div:last-child');
    if(title)title.textContent='Kalender';if(meta)meta.textContent=`${periodText().toUpperCase()} · ${eventCountLabel(state.events.length)}`;
    Array.from(host.children).forEach(child=>{if(child===mount)return;if(!mobile&&child===host.firstElementChild)return;if(mobile&&heading&&child.contains(heading))return;if(!child.dataset.kzOriginalDisplay)child.dataset.kzOriginalDisplay=child.style.display||'__empty__';child.style.display='none';});return mount;
  }
  function renderToolbar(){
    const toolbar=node('div','kz-cal-toolbar');const segment=node('div','kz-cal-segment');segment.setAttribute('role','group');segment.setAttribute('aria-label','Kalenderansicht');
    [['day','Tag'],['week','Woche'],['month','Monat']].forEach(([view,label])=>segment.appendChild(control(label,state.view===view,()=>setView(view))));
    const nav=node('div','kz-cal-nav');nav.append(control('‹',false,()=>navigate(-1)),control('Heute',false,goToday,'is-today'),control('›',false,()=>navigate(1)));
    const filterWrap=node('div','kz-cal-filter-wrap');const filter=node('button',`kz-cal-filter${state.menuOpen?' is-open':''}`);filter.type='button';filter.setAttribute('aria-expanded',state.menuOpen?'true':'false');filter.setAttribute('aria-label','Sichtbare Kalender auswählen');
    const icon=node('span','kz-cal-filter-icon');icon.append(node('i'),node('i'),node('i'));filter.append(icon,node('span',null,'Kalender'),node('span','kz-cal-filter-count',`${selectedCalendarCount()}/${state.calendars.length||'–'}`));
    filter.addEventListener('click',event=>{stop(event);state.menuOpen=!state.menuOpen;renderAll();});filterWrap.appendChild(filter);if(state.menuOpen)filterWrap.appendChild(renderCalendarMenu());toolbar.append(segment,nav,filterWrap);return toolbar;
  }
  function renderCalendarMenu(){
    const box=node('div','kz-cal-popover');box.addEventListener('click',event=>event.stopPropagation());const head=node('div','kz-cal-popover-head');const left=node('div');left.append(node('div','kz-cal-popover-title','Sichtbare Kalender'),node('div','kz-cal-popover-meta',`${selectedCalendarCount()} von ${state.calendars.length} aktiv`));head.appendChild(left);box.appendChild(head);
    const quick=node('div','kz-cal-quick');const standard=node('button',null,'Standard');standard.type='button';standard.title='Standardauswahl ohne Möglichkeiten';standard.addEventListener('click',event=>{stop(event);selectStandardCalendars();});const all=node('button',null,'Alle');all.type='button';all.addEventListener('click',event=>{stop(event);selectAllCalendars();});quick.append(standard,all);box.appendChild(quick);
    const list=node('div','kz-cal-list');if(!state.calendars.length){list.appendChild(node('div','kz-cal-empty',state.loading?'Kalender werden geladen …':'Keine Kalender verfügbar.'));}else state.calendars.forEach(cal=>{const id=String(cal.id),selected=Array.isArray(state.calendarIds)&&state.calendarIds.includes(id),row=node('button',`kz-cal-row${selected?' is-selected':''}`);row.type='button';row.title=String(cal.name||'');const check=node('span','kz-cal-check','✓'),dot=node('span','kz-cal-dot');dot.style.background=String(cal.color||GREEN);row.append(check,dot,node('span','kz-cal-name',calendarDisplayName(cal)));row.addEventListener('click',event=>{stop(event);toggleCalendar(id);});list.appendChild(row);});box.appendChild(list);return box;
  }
  function renderAgenda(date,options){
    const opts=options||{},events=eventsFor(date),agenda=node('div','kz-agenda');if(opts.heading!==false){const head=node('div','kz-agenda-head'),label=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long'}).format(date);head.append(node('div','kz-agenda-date',label),node('div','kz-agenda-count',eventCountLabel(events.length)));agenda.appendChild(head);}const list=node('div','kz-agenda-list');
    if(!events.length){const empty=node('div','kz-cal-empty'),inner=node('div');inner.append(node('div',null,'Keine Termine'),node('div',null,'Dieser Tag ist im ausgewählten Kalenderfilter frei.'));inner.lastChild.style.marginTop='4px';inner.lastChild.style.fontSize='9px';inner.lastChild.style.color=MUTED;empty.appendChild(inner);list.appendChild(empty);}else events.forEach(event=>list.appendChild(renderEvent(event)));agenda.appendChild(list);return agenda;
  }
  function renderEvent(event){
    const item=node('div','kz-event'),start=new Date(event.start),time=event.allDay?'GANZTAG':new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'}).format(start),timeEl=node('div','kz-event-time',time),rail=node('span','kz-event-rail');rail.style.background=eventColor(event);const main=node('div','kz-event-main'),title=node('div','kz-event-title',String(event.title||'(ohne Titel)'));title.title=String(event.title||'');const meta=node('div','kz-event-meta'),calendar=node('span',null,eventCalendarName(event));calendar.title=String(event.calendar||'');meta.appendChild(calendar);if(event.location){const location=node('span',null,'· '+String(event.location));location.title=String(event.location);meta.appendChild(location);}main.append(title,meta);item.append(timeEl,rail,main);return item;
  }
  function renderWeek(){
    const body=node('div','kz-cal-body'),start=rangeStart(),anchor=parseKey(state.anchorDate)||new Date(),strip=node('div','kz-week-strip');
    for(let i=0;i<7;i++){const day=new Date(start);day.setDate(start.getDate()+i);const events=eventsFor(day),selected=dateKey(day)===dateKey(anchor),today=berlinKey(day)===todayKey(),button=node('button',`kz-week-day${selected?' is-selected':''}${today?' is-today':''}`);button.type='button';button.setAttribute('aria-label',new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long'}).format(day));button.append(node('span','kz-week-wd',WEEKDAYS[day.getDay()]),node('span','kz-week-num',String(day.getDate())));const dots=node('span','kz-week-events');events.slice(0,3).forEach(event=>{const dot=node('i');dot.style.background=eventColor(event);dots.appendChild(dot);});if(events.length>3)dots.appendChild(node('span','kz-week-more',`+${events.length-3}`));button.appendChild(dots);button.addEventListener('click',event=>{stop(event);selectWeekDay(day);});strip.appendChild(button);}body.append(strip,renderAgenda(anchor,{heading:true}));return body;
  }
  function renderDay(){const body=node('div','kz-cal-body');body.appendChild(renderAgenda(parseKey(state.anchorDate)||new Date(),{heading:true}));return body;}
  function renderMonth(){
    const body=node('div','kz-cal-body'),month=node('div','kz-month'),weekdays=node('div','kz-month-weekdays');['MO','DI','MI','DO','FR','SA','SO'].forEach(day=>weekdays.appendChild(node('span',null,day)));const grid=node('div','kz-month-grid'),start=rangeStart(),anchor=parseKey(state.anchorDate)||new Date(),anchorMonth=anchor.getMonth();
    for(let i=0;i<42;i++){const day=new Date(start);day.setDate(start.getDate()+i);const events=eventsFor(day),outside=day.getMonth()!==anchorMonth,today=berlinKey(day)===todayKey(),selected=dateKey(day)===dateKey(anchor),cell=node('button',`kz-month-day${outside?' is-outside':''}${today?' is-today':''}${selected?' is-selected':''}`);cell.type='button';cell.setAttribute('aria-label',new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long'}).format(day));cell.appendChild(node('span','kz-month-num',String(day.getDate())));const foot=node('span','kz-month-events'),dots=node('span','kz-month-dots');events.slice(0,3).forEach(event=>{const dot=node('i');dot.style.background=eventColor(event);dots.appendChild(dot);});foot.appendChild(dots);if(events.length)foot.appendChild(node('span','kz-month-count',String(events.length)));cell.appendChild(foot);cell.addEventListener('click',event=>{stop(event);openDay(day);});grid.appendChild(cell);}month.append(weekdays,grid);body.appendChild(month);return body;
  }
  function renderCalendarContent(){if(state.loading){const loading=node('div','kz-cal-body'),box=node('div','kz-cal-loading'),inner=node('div');inner.append(node('div','kz-cal-spinner'),node('div',null,'Kalender wird aktualisiert …'));box.appendChild(inner);loading.appendChild(box);return loading;}if(state.error){const body=node('div','kz-cal-body'),box=node('div','kz-cal-empty'),inner=node('div');inner.append(node('div',null,'Kalender konnte nicht geladen werden'),node('div','kz-cal-error',state.error));box.appendChild(inner);body.appendChild(box);return body;}if(state.view==='day')return renderDay();if(state.view==='month')return renderMonth();return renderWeek();}
  function renderHost(info){const mount=prepareHost(info);mount.replaceChildren();mount.append(renderToolbar(),renderCalendarContent());}

  function setWellbeingDate(value){const candidate=String(value||'');state.wellbeingDate=parseKey(candidate)&&candidate<=todayKey()?candidate:todayKey();state.wellbeingSavedDate='';updateWellbeingBoxes();}
  function selectedWellbeingDate(){const visible=Array.from(document.querySelectorAll('[data-kz-wellbeing-date] input[type="date"]')).find(input=>input.offsetParent!==null&&parseKey(input.value)&&input.value<=todayKey());if(visible)return visible.value;return parseKey(state.wellbeingDate)&&state.wellbeingDate<=todayKey()?state.wellbeingDate:todayKey();}
  function wellbeingStatusText(){if(state.wellbeingSavedDate===state.wellbeingDate){const d=parseKey(state.wellbeingDate);return d?`Gespeichert für ${new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit'}).format(d)}.`:'Gespeichert.';}if(state.wellbeingDate!==todayKey())return'Nachtrag · wird dem gewählten Tag zugeordnet.';return'Heute · Speicherzeit wird separat protokolliert.';}
  function updateWellbeingBoxes(){document.querySelectorAll('[data-kz-wellbeing-date]').forEach(box=>{const input=box.querySelector('input[type="date"]'),today=box.querySelector('[data-kz-wb-today]'),status=box.querySelector('[data-kz-wb-status]');if(input&&input.value!==state.wellbeingDate)input.value=state.wellbeingDate;if(today)today.style.display=state.wellbeingDate===todayKey()?'none':'';if(status){status.textContent=wellbeingStatusText();status.classList.toggle('is-saved',state.wellbeingSavedDate===state.wellbeingDate);}});}
  function renderWellbeingPickers(){
    const seen=new Set();Array.from(document.querySelectorAll('div')).forEach(heading=>{if(!/^(Sechs Werte, 1 bis 10|Hauptgefühl)$/.test((heading.textContent||'').trim()))return;let card=heading.parentElement;while(card&&card!==document.body){const style=card.getAttribute&&card.getAttribute('style')||'';if(/background/.test(style)&&/border-radius/.test(style))break;card=card.parentElement;}if(!card||card===document.body||seen.has(card))return;seen.add(card);let box=card.querySelector('[data-kz-wellbeing-date]');if(!box){box=node('div','kz-wb-date');box.dataset.kzWellbeingDate='1';const label=node('label','kz-wb-date-label','Eintrag für'),input=document.createElement('input');input.type='date';input.className='kz-wb-input';input.max=todayKey();input.value=state.wellbeingDate;input.setAttribute('aria-label','Datum des Wohlbefindenseintrags');input.addEventListener('click',event=>event.stopPropagation());input.addEventListener('change',event=>{event.stopPropagation();setWellbeingDate(event.target.value);});const today=node('button','kz-wb-today','Heute');today.type='button';today.dataset.kzWbToday='1';today.addEventListener('click',event=>{stop(event);setWellbeingDate(todayKey());});const status=node('span','kz-wb-status');status.dataset.kzWbStatus='1';box.append(label,input,today,status);const row=heading.parentElement;if(row&&row.parentElement)row.insertAdjacentElement('afterend',box);else card.prepend(box);}});updateWellbeingBoxes();
  }
  function ensureAdapterPatch(){
    const adapter=window.KZLive;if(!adapter||!adapter.call||!adapter.applyWellbeing)return;if(adapter.saveWellbeing&&adapter.saveWellbeing.__kzBackfillV2)return;
    const save=async function(component){
      if(!component||!component.D||!component.D.wb||!component.D.wb.available)return;const entryDate=selectedWellbeingDate();if(!parseKey(entryDate)||entryDate>todayKey()){adapter.recordActionError(new Error('Ungültiges Datum für den Abendcheck.'));return;}
      const form=component.state.wbForm||{},payload={entryDate,mood:form[0]==null?null:form[0],energy:form[1]==null?null:form[1],innerPressure:form[2]==null?null:form[2],sleepQuality:form[3]==null?null:form[3],motivation:form[4]==null?null:form[4],recovery:form[5]==null?null:form[5],feeling:component.state.wbMood||null,feelingIntensity:null,influenceFactor:component.state.wbFactor||null,reflection:''};
      try{const result=await adapter.call('saveWellbeingEntryV2',payload);if(!result||result.ok===false)throw new Error(result&&result.error?result.error:'Abendcheck konnte nicht gespeichert werden.');if(String(result.entryDate||'')!==entryDate)throw new Error(`Der Abendcheck wurde nicht dem gewählten Datum ${entryDate} zugeordnet.`);state.wellbeingSavedDate=entryDate;adapter.applyWellbeing(result.data||{});const history=Array.isArray(result.data&&result.data.history)?result.data.history:[],todaySaved=history.some(row=>String(row&&row.date||'')===todayKey());component.setState({wbSaved:todaySaved,wbSavedDate:entryDate});updateWellbeingBoxes();}catch(error){adapter.recordActionError(error);}
    };
    save.__kzBackfillV2=true;adapter.saveWellbeing=save;
  }
  function renderAll(){if(observer)observer.disconnect();try{ensureAdapterPatch();findHosts().forEach(renderHost);renderWellbeingPickers();}finally{observe();}}
  function observe(){if(!observer||!document.documentElement)return;observer.observe(document.documentElement,{childList:true,subtree:true});}
  function scheduleRender(){clearTimeout(refreshTimer);refreshTimer=setTimeout(renderAll,70);}

  loadPrefs();ensureAdapterPatch();observer=new MutationObserver(scheduleRender);observe();
  document.addEventListener('pointerdown',ensureAdapterPatch,true);
  document.addEventListener('click',event=>{if(!state.menuOpen)return;if(event.target&&event.target.closest&&event.target.closest('.kz-cal-filter-wrap'))return;state.menuOpen=false;renderAll();});
  window.addEventListener('beforeunload',()=>{if(observer)observer.disconnect();clearTimeout(refreshTimer);document.removeEventListener('pointerdown',ensureAdapterPatch,true);});
  renderAll();loadCalendar(false);
})();
</script>

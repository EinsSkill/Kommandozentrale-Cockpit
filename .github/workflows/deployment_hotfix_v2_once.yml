name: Deployment coherence hotfix v2 once

on:
  push:
    branches:
      - fix/deployment-coherence-hotfix-v2
    paths:
      - .github/workflows/deployment_hotfix_v2_once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deployment-coherence-hotfix-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v2 deployment coherence patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact('src/Code.gs', 'KZ_V31_BASE_LIVE_HOTFIX_1', 'KZ_V31_BASE_LIVE_HOTFIX_2')
          replace_exact('src/Code.gs', "PHASE7_LIVE_HOTFIX_1", "PHASE7_LIVE_HOTFIX_2")

          replace_exact(
              'src/LiveAdapter.html',
              "if (!value || value.runtimeVersion !== 'PHASE7_LIVE_HOTFIX_1') return 'OPS-Backend ist nicht auf dem aktuellen Hotfix-Stand.';",
              "if (!value || value.runtimeVersion !== 'PHASE7_LIVE_HOTFIX_2') return 'OPS-Backend-Stand ' + text(value && value.runtimeVersion || 'UNBEKANNT') + ' passt nicht zu PHASE7_LIVE_HOTFIX_2.';"
          )

          for test_path in ['tests/live-regression-hotfix.test.mjs', 'tests/live-adapter-render.test.mjs']:
              p = Path(test_path)
              text = p.read_text(encoding='utf-8')
              if 'PHASE7_LIVE_HOTFIX_1' not in text:
                  raise SystemExit(f'v1 runtime marker missing in {test_path}')
              text = text.replace('PHASE7_LIVE_HOTFIX_1', 'PHASE7_LIVE_HOTFIX_2')
              text = text.replace('KZ_V31_BASE_LIVE_HOTFIX_1', 'KZ_V31_BASE_LIVE_HOTFIX_2')
              p.write_text(text, encoding='utf-8')

          p = Path('tests/live-regression-hotfix.test.mjs')
          text = p.read_text(encoding='utf-8')
          needle = "  assert.match(adapter, /isCurrent\\(generation, component\\)/);\n"
          if needle not in text:
              raise SystemExit('test insertion marker missing')
          text = text.replace(needle, needle + "  assert.match(adapter, /OPS-Backend-Stand/);\n  assert.match(adapter, /PHASE7_LIVE_HOTFIX_2/);\n")
          p.write_text(text, encoding='utf-8')
          PY
      - run: npm test
      - name: Commit tested runtime files
        run: |
          git config user.name "EinsSkill"
          git config user.email "62189370+EinsSkill@users.noreply.github.com"
          git add -- src/Code.gs src/LiveAdapter.html tests/live-regression-hotfix.test.mjs tests/live-adapter-render.test.mjs
          git diff --cached --check
          git commit -m "fix: make Apps Script deployment runtime version explicit"
          git push origin HEAD:fix/deployment-coherence-hotfix-v2

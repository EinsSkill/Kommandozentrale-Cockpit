name: Apply weather and briefing fix

on:
  push:
    branches:
      - fix/weather-cache-briefing-visible

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[weather-briefing-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weather-cache-briefing-visible
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply focused patch
        run: python3 tools/apply_weather_briefing_fix.py
      - name: Run full tests
        run: npm test
      - name: Commit tested source changes and remove patch helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_weather_briefing_fix.py .github/workflows/apply-weather-briefing-fix.yml
          git add -- src/Weather.gs src/LiveAdapter.html tests/weather-rate-limit.test.mjs tests/live-adapter-render.test.mjs
          git commit -m "[weather-briefing-fixed] Keep stale weather visible and surface briefing"
          git push origin HEAD:fix/weather-cache-briefing-visible

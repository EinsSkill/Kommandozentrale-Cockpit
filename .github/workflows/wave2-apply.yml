name: Apply Wave 2 Calendar refactor

on:
  push:
    branches:
      - refactor/kz-1-0-wave2-calendar-single-path
    paths:
      - .github/workflows/wave2-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/kz-1-0-wave2-calendar-single-path
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply deterministic Calendar refactor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          src = root / 'src'
          tests = root / 'tests'

          # 1) Extract the canonical V4 Calendar server logic into its own service.
          zz_path = src / 'ZZ_CalendarWellbeingEnhancements.gs'
          zz = zz_path.read_text(encoding='utf-8')
          cal_start = zz.find('function getCalendarViewV4')
          wellbeing_marker = zz.find('/**\n * Uses the existing audited V1 upsert')
          assert cal_start >= 0, 'getCalendarViewV4 not found in ZZ file'
          assert wellbeing_marker > cal_start, 'wellbeing marker not found after Calendar implementation'

          calendar_impl = zz[cal_start:wellbeing_marker].rstrip() + '\n'
          calendar_service = """/**
           * Kommandozentrale – canonical Google Calendar read service.
           *
           * Google Calendar is the source of truth. This module is the only runtime
           * implementation allowed to enumerate calendars or read Calendar events.
           * Selection/filter state remains presentation-only and never writes Calendar.
           */

          """ + calendar_impl
          (src / 'CalendarService.gs').write_text(calendar_service, encoding='utf-8')

          wellbeing_only = """/**
           * Kommandozentrale – dated wellbeing compatibility extension.
           *
           * Calendar server logic moved to CalendarService.gs in KZ 1.0 Phase 7 Wave 2.
           * This file intentionally contains only the dated wellbeing endpoint.
           */

          """ + zz[wellbeing_marker:]
          zz_path.write_text(wellbeing_only, encoding='utf-8')

          # 2) Remove the independent V3 Calendar aggregation from Code.gs.
          code_path = src / 'Code.gs'
          code = code_path.read_text(encoding='utf-8')
          code = code.replace("const CACHE_CAL = 'KZ_V3_CAL';\n", '')

          legacy_pattern = re.compile(
              r"/\*\* Calendar loads separately so it can never block the OPS cockpit\. \*/\n"
              r"function getCalendarWeekV3\(force\) \{[\s\S]*?\n\}\n",
              re.M,
          )
          legacy_replacement = """/**
           * @deprecated Compatibility wrapper for older callers.
           * The canonical Calendar runtime is getCalendarViewV4 in CalendarService.gs.
           */
          function getCalendarWeekV3(force) {
            const calendar = getCalendarViewV4({ view: 'week' }, !!force);
            return {
              generatedAt: calendar.generatedAt,
              weekStart: calendar.rangeStart,
              weekEnd: calendar.rangeEnd,
              events: calendar.events || [],
              calendars: calendar.calendars || [],
              selectedCalendarIds: calendar.selectedCalendarIds || [],
              compatibilitySource: 'getCalendarViewV4'
            };
          }
          """
          code, count = legacy_pattern.subn(legacy_replacement, code, count=1)
          assert count == 1, f'expected one getCalendarWeekV3 implementation, got {count}'

          aggregate_pattern = re.compile(
              r"\nfunction getCalendarWeek_\(now\) \{[\s\S]*?\n\}\n\nfunction getMailFromRefs_\(\)",
              re.M,
          )
          code, count = aggregate_pattern.subn('\nfunction getMailFromRefs_()', code, count=1)
          assert count == 1, f'expected one legacy getCalendarWeek_ aggregator, got {count}'
          assert 'CalendarApp.getAllCalendars()' not in code, 'Code.gs still reads CalendarApp directly'
          code_path.write_text(code, encoding='utf-8')

          # 3) Point the live cockpit adapter at the same canonical V4 endpoint/shape.
          adapter_path = src / 'LiveAdapter.html'
          adapter = adapter_path.read_text(encoding='utf-8')
          old_job = "['calendar', 'getCalendarWeekV3', value => this.applyCalendar(value)],"
          new_job = "['calendar', 'getCalendarViewV4', value => this.applyCalendar(value)],"
          assert adapter.count(old_job) == 1, 'legacy Calendar job not found exactly once'
          adapter = adapter.replace(old_job, new_job)
          old_start = 'const start = date(value && value.weekStart) || mondayOfCurrentWeek();'
          new_start = 'const start = date(value && (value.rangeStart || value.weekStart)) || mondayOfCurrentWeek();'
          assert adapter.count(old_start) == 1, 'applyCalendar legacy weekStart line not found exactly once'
          adapter = adapter.replace(old_start, new_start)
          adapter_path.write_text(adapter, encoding='utf-8')

          # Existing live-surface assertions should now expect the canonical endpoint.
          for name in ['claude-design-live.test.mjs', 'mobile-design-live.test.mjs']:
              path = tests / name
              text = path.read_text(encoding='utf-8')
              text = text.replace("'getCalendarWeekV3'", "'getCalendarViewV4'")
              path.write_text(text, encoding='utf-8')

          # 4) Keep Calendar and wellbeing tests aligned with separated server ownership.
          calendar_test = r'''import assert from 'node:assert/strict';
          import { readFile, readdir } from 'node:fs/promises';
          import { dirname, join } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import test from 'node:test';

          const root = join(dirname(fileURLToPath(import.meta.url)), '..');
          const src = join(root, 'src');
          const code = await readFile(join(src, 'Code.gs'), 'utf8');
          const calendarServer = await readFile(join(src, 'CalendarService.gs'), 'utf8');
          const wellbeingServer = await readFile(join(src, 'ZZ_CalendarWellbeingEnhancements.gs'), 'utf8');
          const client = await readFile(join(src, 'CalendarWellbeingEnhancements.html'), 'utf8');
          const desktop = await readFile(join(src, 'Index.html'), 'utf8');
          const mobile = await readFile(join(src, 'MobileIndex.html'), 'utf8');

          test('Code.gs owns the single web entry point and injects the enhancement without modifying design sources', async () => {
            const gsFiles = (await readdir(src)).filter(name => name.endsWith('.gs'));
            let doGetCount = 0;
            for (const name of gsFiles) {
              const content = await readFile(join(src, name), 'utf8');
              doGetCount += (content.match(/function\s+doGet\s*\(/g) || []).length;
            }
            assert.equal(doGetCount, 1);
            assert.match(code, /createTemplateFromFile\(view\)/);
            assert.match(code, /CalendarWellbeingEnhancements/);
            assert.match(code, /rendered\.replace/);
            assert.match(code, /Heute im Kalender/);
            assert.doesNotMatch(calendarServer, /function\s+doGet\s*\(/);
            assert.doesNotMatch(wellbeingServer, /function\s+doGet\s*\(/);
            assert.match(desktop, /Claude Design source SHA-256/);
            assert.match(desktop, /data-kz-calendar-detail-host/);
            assert.match(desktop, /showLedger:dk!=='calendar'/);
            assert.match(mobile, /Claude Mobile Design source SHA-256/);
          });

          test('calendar endpoint supports day week month and hides Möglichkeiten by default', () => {
            assert.match(calendarServer, /getCalendarViewV4/);
            assert.match(calendarServer, /\['day', 'week', 'month'\]/);
            assert.match(calendarServer, /defaultVisible: !\/möglichkeit\/i/);
            assert.match(calendarServer, /CalendarApp\.getAllCalendars\(\)/);
            assert.match(client, /kz\.calendar\.v2/);
            for (const label of ['Tag', 'Woche', 'Monat', 'Heute', 'Kalender']) {
              assert.match(client, new RegExp(label));
            }
          });

          test('calendar redesign keeps dense views inside the tile and uses purpose-built day week month layouts', () => {
            assert.match(client, /kz-cal-desktop/);
            assert.match(client, /kz-cal-detail/);
            assert.match(client, /renderLargeTimeGrid/);
            assert.match(client, /largeTimeSegmentsForDay/);
            assert.match(client, /function isAllDayEvent/);
            assert.match(client, /!isAllDayEvent\(event\)/);
            assert.match(client, /filter\(event=>isAllDayEvent\(event\)/);
            assert.match(client, /height:max-content/);
            assert.match(client, /kz-large-now-line/);
            assert.match(client, /renderLargeNowIndicator/);
            assert.match(client, /hour<=LARGE_GRID_HOURS/);
            assert.match(client, /halfHour<=LARGE_GRID_HOURS\*2/);
            assert.match(client, /is-start/);
            assert.match(client, /is-end/);
            assert.match(client, /position:absolute/);
            assert.match(client, /kz-week-strip/);
            assert.match(client, /kz-agenda-list/);
            assert.match(client, /kz-month-grid/);
            assert.match(client, /kz-month-dots/);
            assert.match(client, /openDay\(day\)/);
            assert.doesNotMatch(client, /component\.D\.week\s*=/);
          });

          test('calendar selection remains presentation state and does not write Google Calendar', () => {
            assert.doesNotMatch(calendarServer, /cal\.createEvent|ev\.deleteEvent|CalendarApp\.createEvent/);
            assert.match(calendarServer, /cal\.getEvents\(range\.start, range\.end\)/);
            assert.match(client, /localStorage\.setItem\(PREF_KEY/);
            assert.match(client, /selectStandardCalendars/);
            assert.match(client, /selectAllCalendars/);
          });

          test('wellbeing backfill reads the visible selected date and verifies the server saved the same logical date', () => {
            assert.match(wellbeingServer, /saveWellbeingEntryV2/);
            assert.match(wellbeingServer, /entryDate > today/);
            assert.match(wellbeingServer, /saveWellbeingEntryV1\(p\)/);
            assert.match(client, /input\.type='date'/);
            assert.match(client, /input\.max=todayKey\(\)/);
            assert.match(client, /selectedWellbeingDate/);
            assert.match(client, /entryDate/);
            assert.match(client, /saveWellbeingEntryV2/);
            assert.match(client, /result\.entryDate/);
            assert.match(client, /__kzBackfillV2/);
            assert.match(client, /pointerdown',ensureAdapterPatch,true/);
            assert.match(client, /wbSaved:todaySaved/);
            assert.doesNotMatch(client, /kz\.wellbeing\.entryDate/);
          });

          test('desktop and mobile share the enhancement layer with cockpit styling and usable touch targets', () => {
            assert.match(client, /Kommandozentrale Mobil/);
            assert.match(client, /#1B4632/);
            assert.match(client, /#B8912F/);
            assert.match(client, /min-height:44px/);
            assert.match(client, /observer\.disconnect\(\)/);
            assert.match(client, /kz-cal-popover/);
          });

          test('embedded enhancement JavaScript remains syntactically parseable', () => {
            const match = client.match(/<script>([\s\S]*?)<\/script>/);
            assert.ok(match, 'enhancement script block missing');
            assert.doesNotThrow(() => new Function(match[1]));
          });
          '''
          # Dedent the intentionally indented workflow heredoc payload.
          import textwrap
          (tests / 'calendar-wellbeing-enhancements.test.mjs').write_text(textwrap.dedent(calendar_test), encoding='utf-8')

          single_path_test = r'''import assert from 'node:assert/strict';
          import { readFile, readdir } from 'node:fs/promises';
          import { dirname, join } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import vm from 'node:vm';
          import test from 'node:test';

          const root = join(dirname(fileURLToPath(import.meta.url)), '..');
          const src = join(root, 'src');
          const code = await readFile(join(src, 'Code.gs'), 'utf8');
          const service = await readFile(join(src, 'CalendarService.gs'), 'utf8');
          const wellbeing = await readFile(join(src, 'ZZ_CalendarWellbeingEnhancements.gs'), 'utf8');
          const adapter = await readFile(join(src, 'LiveAdapter.html'), 'utf8');
          const enhancement = await readFile(join(src, 'CalendarWellbeingEnhancements.html'), 'utf8');

          test('only CalendarService owns direct Google Calendar reads', async () => {
            const gsFiles = (await readdir(src)).filter(name => name.endsWith('.gs'));
            const readers = [];
            for (const name of gsFiles) {
              const content = await readFile(join(src, name), 'utf8');
              if (/CalendarApp\.getAllCalendars\(\)|\.getEvents\(range\.start,\s*range\.end\)/.test(content)) readers.push(name);
            }
            assert.deepEqual(readers, ['CalendarService.gs']);
            assert.doesNotMatch(code, /function\s+getCalendarWeek_\s*\(/);
            assert.doesNotMatch(wellbeing, /getCalendarViewV4|CalendarApp\.getAllCalendars/);
          });

          test('legacy V3 endpoint delegates to the canonical V4 service and does not aggregate independently', () => {
            assert.match(code, /function getCalendarWeekV3\(force\)[\s\S]*getCalendarViewV4\(\{ view: 'week' \}, !!force\)/);
            assert.match(code, /compatibilitySource: 'getCalendarViewV4'/);
            assert.doesNotMatch(code, /CACHE_CAL/);
          });

          test('both cockpit Calendar consumers use the canonical V4 contract', () => {
            assert.match(adapter, /\['calendar', 'getCalendarViewV4'/);
            assert.match(adapter, /value\.rangeStart \|\| value\.weekStart/);
            assert.doesNotMatch(adapter, /\['calendar', 'getCalendarWeekV3'/);
            assert.match(enhancement, /call\('getCalendarViewV4'/);
          });

          test('canonical range helper keeps deterministic day week month boundaries', () => {
            const context = { Date };
            vm.createContext(context);
            vm.runInContext(service, context);
            const anchor = new Date(2026, 7, 27, 12, 0, 0, 0); // Thursday
            const day = context.calendarV4Range_('day', anchor);
            const week = context.calendarV4Range_('week', anchor);
            const month = context.calendarV4Range_('month', anchor);
            assert.equal(day.dayCount, 1);
            assert.equal(week.dayCount, 7);
            assert.equal(week.start.getDay(), 1);
            assert.equal(month.dayCount, 42);
            assert.equal(month.start.getDay(), 1);
          });
          '''
          (tests / 'calendar-single-path.test.mjs').write_text(textwrap.dedent(single_path_test), encoding='utf-8')

          # 5) Record the architecture contract for later waves.
          docs = root / 'docs'
          (docs / 'calendar-runtime-contract.md').write_text("""# Calendar Runtime Contract – KZ 1.0

          ## Status

          Phase 7 Wave 2 canonical contract.

          ## Source of truth

          Google Calendar remains the source of truth for Calendar events. The cockpit never mirrors event truth into OPS for display and this wave introduces no Calendar writes.

          ## Canonical runtime

          `src/CalendarService.gs` is the only server module allowed to enumerate Google calendars or read events. The public canonical endpoint is `getCalendarViewV4(request, force)`.

          The canonical response supports `day`, `week`, and `month`, exposes `rangeStart` / `rangeEnd`, calendar metadata, selected calendar IDs, and normalized event objects.

          `getCalendarWeekV3(force)` remains only as a compatibility wrapper for older callers. It must delegate to `getCalendarViewV4` and must never access `CalendarApp` directly.

          Both the live cockpit adapter and `CalendarWellbeingEnhancements.html` use `getCalendarViewV4` as their runtime endpoint.

          ## Presentation state

          Calendar selection/filtering is presentation state. The `Möglichkeiten` calendar stays hidden by default unless the user selects it. Filter preferences may be stored locally in the browser; they do not write to Google Calendar.

          ## Out of scope

          Calendar scrolling, layout polish, navigation UX, and other work tracked by `TASK_000024` are intentionally not part of this contract refactor.
          """, encoding='utf-8')

          print('Wave 2 Calendar refactor applied.')
          PY

      - name: Run repository tests
        run: npm test

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/CalendarService.gs src/Code.gs src/LiveAdapter.html src/ZZ_CalendarWellbeingEnhancements.gs tests/calendar-wellbeing-enhancements.test.mjs tests/calendar-single-path.test.mjs tests/claude-design-live.test.mjs tests/mobile-design-live.test.mjs docs/calendar-runtime-contract.md
          git commit -m "refactor: consolidate Calendar runtime path (#35)"
          git push origin HEAD:refactor/kz-1-0-wave2-calendar-single-path

name: Apply calendar and wellbeing patch

on:
  push:
    branches:
      - feature/modular-calendar-wellbeing-date

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[calendar-ui-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/modular-calendar-wellbeing-date
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply focused source patch
        run: python3 tools/apply_calendar_wellbeing_patch.py

      - name: Run repository tests
        run: npm test

      - name: Commit tested source changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No generated source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LiveAdapter.html src/Index.html src/MobileIndex.html tests/claude-design-live.test.mjs tests/mobile-design-live.test.mjs tests/calendar-wellbeing-enhancements.test.mjs
          git commit -m "[calendar-ui-patched] Add modular calendar controls and wellbeing date picker"
          git push origin HEAD:feature/modular-calendar-wellbeing-date

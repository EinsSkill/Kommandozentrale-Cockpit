name: Apply Phase 7 Wave 6-7 once

on:
  push:
    branches:
      - refactor/kz-1-0-phase7-finalization

permissions:
  contents: write

jobs:
  apply-once:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply scoped Wave 6-7 patch
        run: python3 .github/scripts/phase7_wave7_once.py

      - name: Run full repository regression
        run: npm test

      - name: Commit scoped runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src docs tests
          git diff --cached --quiet && exit 0
          git commit -m "refactor: finish Phase 7 Food and frontend runtime"
          git push

name: Apply Phase 7 Wave 6-7 once

on:
  push:
    branches:
      - refactor/kz-1-0-phase7-finalization

permissions:
  contents: write

jobs:
  apply-once:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply scoped Wave 6-7 patch
        run: python3 .github/scripts/phase7_wave7_once.py

      - name: Align remaining legacy mobile routing assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/mobile-design-live.test.mjs')
          s = p.read_text(encoding='utf-8')
          old = "  assert.match(code, /requestedView === 'mobile' \\? 'MobileIndex'/);\n  assert.match(code, /: 'Index';/);"
          new = "  assert.match(code, /requestedView === 'mobile' \\|\\| requestedView === 'food-mobile'/);\n  assert.match(code, /'MobileIndex' : 'Index'/);"
          if old not in s:
              raise SystemExit('legacy mobile routing assertion not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run full repository regression
        run: npm test

      - name: Commit scoped runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src docs tests
          git diff --cached --quiet && exit 0
          git commit -m "refactor: finish Phase 7 Food and frontend runtime"
          git push

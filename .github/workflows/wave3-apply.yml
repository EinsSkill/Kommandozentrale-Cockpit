name: Apply Wave 3 Operator refactor

on:
  push:
    branches:
      - refactor/kz-1-0-wave3-operator-briefing-separation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply scoped refactor
        run: python3 .github/scripts/wave3_apply.py
      - name: Run tests
        run: npm test
      - name: Commit scoped changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LiveAdapter.html tests/live-adapter-render.test.mjs tests/operator-briefing-separation.test.mjs docs/operator-briefing-contract.md
          git commit -m "refactor: separate live Operator from Briefing snapshot (#37)"
          git push

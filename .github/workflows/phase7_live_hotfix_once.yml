name: Phase 7 live regression hotfix once

on:
  push:
    branches:
      - fix/phase7-live-regression-food-ops-v1
    paths:
      - .github/workflows/phase7_live_hotfix_once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase7-live-regression-food-ops-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic hotfix and run full tests
        run: python .github/scripts/phase7_live_hotfix_once.py
      - name: Commit tested hotfix
        run: |
          git config user.name "EinsSkill"
          git config user.email "62189370+EinsSkill@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 1
          fi
          git commit -m "fix: stabilize Food mount and OPS live payload"
          git push origin HEAD:fix/phase7-live-regression-food-ops-v1

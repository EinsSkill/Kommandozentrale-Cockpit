name: Apply single doGet fix

on:
  push:
    branches:
      - fix/single-apps-script-doget-final

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[single-doget-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/single-apps-script-doget-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply focused patch
        run: python3 tools/fix_single_doget.py
      - name: Run full tests
        run: npm test
      - name: Commit tested source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/Code.gs src/ZZ_CalendarWellbeingEnhancements.gs tests/single-doget-contract.test.mjs
          git commit -m "[single-doget-fixed] Keep one Apps Script doGet entry point"
          git push origin HEAD:fix/single-apps-script-doget-final

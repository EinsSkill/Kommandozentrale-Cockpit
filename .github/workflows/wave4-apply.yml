name: Apply Wave 4 system status truth

on:
  push:
    branches:
      - refactor/kz-1-0-wave4-system-status-truth

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply scoped refactor
        run: python3 .github/scripts/wave4_apply.py

      - name: Run tests
        run: npm test

      - name: Commit scoped changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/Code.gs src/LiveAdapter.html src/Index.html src/MobileIndex.html tests/system-status-truth.test.mjs docs/system-status-truth-contract.md
          git diff --cached --quiet && exit 0
          git commit -m "refactor: make system status surface truthful (#39)"
          git push

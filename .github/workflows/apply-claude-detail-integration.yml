name: Apply Claude detail integration

on:
  push:
    branches:
      - feature/claude-full-detail-views

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/claude-full-detail-views
          fetch-depth: 0

      - name: Rebuild Claude desktop source
        shell: bash
        run: |
          set -euo pipefail
          cat tools/claude_payload_01.b64 tools/claude_payload_02.b64 tools/claude_payload_03.b64 tools/claude_payload_04.b64 tools/claude_payload_05.b64 > /tmp/index.xz.b64
          test "$(wc -c < /tmp/index.xz.b64)" -eq 48540
          base64 -d /tmp/index.xz.b64 > /tmp/index.xz
          xz -t /tmp/index.xz
          xz -dc /tmp/index.xz > src/Index.html
          test "$(wc -c < src/Index.html)" -gt 200000

      - name: Apply identity fix to mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/MobileIndex.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Guten Morgen, Luke.': 'Guten Morgen, Lukes.',
              'Mittagsstand, Luke.': 'Mittagsstand, Lukes.',
              'Guten Abend, Luke.': 'Guten Abend, Lukes.',
              'Späte Schicht, Luke.': 'Späte Schicht, Lukes.',
              'VERLIEHEN AN LUKE': 'VERLIEHEN AN LUKES',
              "keys.endsWith('luke')": "keys.endsWith('lukes')",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify integration contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Guten Morgen, Lukes\." src/Index.html
          grep -q "jumpDetail" src/Index.html
          grep -q "taskOrder" src/Index.html
          grep -q "window.KZLive.completeTask" src/Index.html
          grep -q "window.KZLive.searchSecondBrain" src/Index.html
          grep -q "keys.endsWith('lukes')" src/Index.html
          ! grep -q "Guten Morgen, Luke\." src/Index.html
          ! grep -q "Guten Morgen, Luke\." src/MobileIndex.html
          ! grep -q "VERLIEHEN AN LUKE ·" src/Index.html
          ! grep -q "VERLIEHEN AN LUKE ·" src/MobileIndex.html

      - name: Commit integrated sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/claude_payload_*.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Index.html src/MobileIndex.html tools/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "feat: adopt Claude full detail views"
          git push origin HEAD:feature/claude-full-detail-views
